<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>InterviewAgent</title>
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <strong>InterviewAgent</strong>
          <span>AI 模拟面试系统</span>
        </div>

        <button id="newInterviewBtn" class="new-btn" type="button">新建面试</button>

        <div class="mode-switch" role="group" aria-label="面试模式">
          <button id="practiceModeBtn" class="mode-btn active" type="button" data-mode="practice">模拟</button>
          <button id="examModeBtn" class="mode-btn" type="button" data-mode="exam">考试</button>
        </div>

        <label class="field compact">
          <span>用户 ID</span>
          <input id="userId" autocomplete="off" value="demo-user" />
        </label>

        <section class="side-section">
          <div class="section-title">
            <span>历史会话</span>
            <button id="refreshSessions" class="ghost-icon" title="刷新历史" type="button">↻</button>
          </div>
          <div id="sessionList" class="session-list"></div>
        </section>

        <div class="connection">
          <span id="healthDot" class="dot"></span>
          <span id="healthText">连接中</span>
          <span id="streamState">idle</span>
        </div>
      </aside>

      <section class="main">
        <header class="progress-bar" id="progressBar"></header>

        <section id="setupView" class="setup-view">
          <div class="setup-copy">
            <p class="eyebrow">准备面试</p>
            <h1>输入岗位和简历，开始一场真实的技术面。</h1>
            <p id="modeDescription">模拟模式会在每题后给出评分、命中要点和改进建议。</p>
          </div>
          <div class="setup-grid">
            <label class="field">
              <span>岗位 JD</span>
              <textarea id="jdText">需要 Go 后端工程师，熟悉高并发服务、Redis、PostgreSQL、消息队列和线上问题排查。</textarea>
            </label>
            <label class="field">
              <span>候选人简历</span>
              <textarea id="resumeText">两年 Go 后端经验，参与过秒杀活动、Redis 缓存优化、Kafka 消费链路和 PostgreSQL 查询优化。</textarea>
            </label>
          </div>
          <div class="setup-actions">
            <button id="startBtn" class="primary" type="button">开始面试</button>
            <button id="resetBtn" class="secondary" type="button">清空</button>
          </div>
        </section>

        <section id="interviewView" class="interview-view hidden">
          <div class="interview-head">
            <div>
              <p id="sessionMeta" class="eyebrow">未开始</p>
              <h1 id="sessionTitle">模拟面试</h1>
            </div>
            <span id="statusPill" class="status-pill">等待作答</span>
          </div>

          <div id="conversation" class="conversation"></div>

          <form id="answerForm" class="answer-dock">
            <button id="endInterviewBtn" class="danger" type="button">终止面试</button>
            <textarea id="answerText" rows="1" placeholder="输入你的回答..."></textarea>
            <button id="answerBtn" class="send" type="submit">发送</button>
          </form>
        </section>

        <section id="reportView" class="report-view hidden">
          <div class="report-head">
            <div>
              <p class="eyebrow">最终报告</p>
              <h1><span id="reportScore">0</span><small>分</small></h1>
            </div>
            <button id="backToSetupBtn" class="secondary" type="button">新面试</button>
          </div>

          <div id="skillBreakdown" class="score-grid"></div>

          <div class="report-summary">
            <section>
              <h2>亮点</h2>
              <ul id="reportHighlights"></ul>
            </section>
            <section>
              <h2>改进项</h2>
              <ul id="reportImprovements"></ul>
            </section>
            <section>
              <h2>下一步</h2>
              <ul id="reportNextSteps"></ul>
            </section>
          </div>

          <section class="round-review">
            <h2>逐题评分</h2>
            <div id="reportRounds"></div>
          </section>
        </section>
      </section>
    </main>

    <script src="/assets/app.js"></script>
  </body>
</html>
