run:
  timeout: 5m
  go: "1.25"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - bodyclose
    - contextcheck
    - errorlint
    - nilerr
    - prealloc

issues:
  exclude-rules:
    - path: _test\.go
      linters: [errcheck, prealloc]
